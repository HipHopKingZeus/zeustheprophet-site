name: Unpack site assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode bundle into images and fonts
        run: |
          if [ ! -d _bundle ]; then echo "Nothing to unpack"; exit 0; fi
          cat _bundle/part* | base64 -d > b.tgz
          sha256sum -c _bundle/SHA256
          tar xzf b.tgz
          rm b.tgz
          git rm -rq _bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack images and fonts"
          git push origin HEAD:main
